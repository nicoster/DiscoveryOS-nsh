[package]
name = "nsh-app-discoveryos"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.3.0"
nsh-base = "0.3.0"
encoding_rs = "0.8"
nsh-engine = { version = "=0.3.0", features = ["js"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }
